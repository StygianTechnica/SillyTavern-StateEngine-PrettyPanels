<div id="pretty_panels_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Pretty Panels</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <div class="pp-settings-row">
                <label class="checkbox_label">
                    <input id="pp_enabled" type="checkbox" />
                    <span>Enable Pretty Panels</span>
                </label>
            </div>

            <div class="pp-settings-row">
                <label class="checkbox_label" title="Show drag strips, resize handles and edit affordances on every panel, and the New Pretty Panel entry in the Extensions menu.">
                    <input id="pp_editing_mode" type="checkbox" />
                    <span>Editing Mode</span>
                </label>
            </div>

            <!-- Future global settings go here. -->
            <div id="pp_global_settings" class="pp-settings-section"></div>

        </div>
    </div>
</div>
